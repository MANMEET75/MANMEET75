<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc" xml:space="preserve">
  <title id="title">Manmeet Singh — AI Engineer</title>
  <desc id="desc">A dark developer terminal showing a short Semantra Python classification example beside Manmeet Singh's name and AI Engineer title.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#101932"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58e1e8"/>
      <stop offset="1" stop-color="#aa91ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#263352" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>

  <rect width="1000" height="440" rx="22" fill="url(#background)"/>
  <rect width="1000" height="440" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="998" height="438" rx="21" fill="none" stroke="#314260" stroke-width="2"/>
  <rect x="34" y="34" width="7" height="372" rx="3.5" fill="url(#accent)"/>

  <text x="68" y="91" fill="#58e1e8" font-family="SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="2">~/profile</text>
  <text x="68" y="166" fill="#f1f5ff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="54">Manmeet</text>
  <text x="68" y="226" fill="#f1f5ff" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="54">Singh</text>
  <rect x="68" y="251" width="212" height="42" rx="9" fill="#173c4f" stroke="#337e92"/>
  <text x="85" y="278" fill="#a5f8f2" font-family="SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">AI Engineer</text>
  <text x="68" y="333" fill="#b2bfd9" font-family="Arial, Helvetica, sans-serif" font-size="20">NLP · Retrieval · Agent systems</text>
  <text x="68" y="368" fill="#8595b5" font-family="SFMono-Regular, Consolas, monospace" font-size="17">build → evaluate → ship</text>

  <rect x="455" y="48" width="505" height="344" rx="16" fill="#0d1425" stroke="#445577" stroke-width="2"/>
  <path d="M 455 64 A 16 16 0 0 1 471 48 H 944 A 16 16 0 0 1 960 64 V 91 H 455 Z" fill="#1b2740"/>
  <circle cx="482" cy="70" r="7" fill="#ff6b7d"/>
  <circle cx="507" cy="70" r="7" fill="#ffd36a"/>
  <circle cx="532" cy="70" r="7" fill="#5fe1aa"/>
  <text x="707" y="76" fill="#aabbd7" font-family="SFMono-Regular, Consolas, monospace" font-size="16" text-anchor="middle">semantra / quickstart.py</text>

  <g font-family="SFMono-Regular, Consolas, monospace" font-size="18">
    <text x="482" y="134" fill="#7485a4">01</text>
    <text x="528" y="134"><tspan fill="#bb9cff">from</tspan><tspan fill="#e9efff"> semantra </tspan><tspan fill="#bb9cff">import</tspan><tspan fill="#8fe8f0"> Classifier</tspan></text>
    <text x="482" y="178" fill="#7485a4">02</text>
    <text x="528" y="178"><tspan fill="#e9efff">model = </tspan><tspan fill="#8fe8f0">Classifier</tspan><tspan fill="#e9efff">()</tspan></text>
    <text x="482" y="222" fill="#7485a4">03</text>
    <text x="528" y="222"><tspan fill="#e9efff">model.add_class(</tspan><tspan fill="#b6e79f">"billing"</tspan><tspan fill="#e9efff">, [</tspan><tspan fill="#b6e79f">"charged"</tspan><tspan fill="#e9efff">])</tspan></text>
    <text x="482" y="266" fill="#7485a4">04</text>
    <text x="528" y="266"><tspan fill="#e9efff">result = model.predict(</tspan></text>
    <text x="528" y="296" fill="#b6e79f">    "charged"</text>
    <text x="528" y="326" fill="#e9efff">)</text>
  </g>
  <rect x="482" y="344" width="450" height="31" rx="7" fill="#162e38"/>
  <text x="496" y="365" fill="#8ee9d0" font-family="SFMono-Regular, Consolas, monospace" font-size="16">$ result.class_name → billing</text>
</svg>
