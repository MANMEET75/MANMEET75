<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
  <title id="title">How Semantra classifies text</title>
  <desc id="desc">A text query is evaluated through ONNX semantic embeddings and BM25 lexical matching. Fused scores and confidence checks produce a class label or Unknown.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1425"/>
      <stop offset="1" stop-color="#131e36"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 7 4 L 0 8 Z" fill="#6acbd9"/>
    </marker>
  </defs>
  <rect width="1000" height="280" rx="20" fill="url(#background)"/>
  <rect x="1" y="1" width="998" height="278" rx="19" fill="none" stroke="#314260" stroke-width="2"/>
  <text x="34" y="43" fill="#a9b9d6" font-family="SFMono-Regular, Consolas, monospace" font-size="19">semantra/classification_pipeline</text>
  <path d="M 34 60 H 966" stroke="#33415e" stroke-width="2"/>

  <rect x="30" y="91" width="170" height="135" rx="14" fill="#192641" stroke="#4b668b" stroke-width="2"/>
  <text x="48" y="123" fill="#6de1e5" font-family="SFMono-Regular, Consolas, monospace" font-size="16">01 / INPUT</text>
  <text x="48" y="159" fill="#f2f5ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Text query</text>
  <text x="48" y="189" fill="#b0bfda" font-family="SFMono-Regular, Consolas, monospace" font-size="15">"charged twice"</text>

  <path d="M 204 158 H 236" stroke="#6acbd9" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="246" y="91" width="253" height="135" rx="14" fill="#192641" stroke="#4b668b" stroke-width="2"/>
  <text x="265" y="123" fill="#6de1e5" font-family="SFMono-Regular, Consolas, monospace" font-size="16">02 / MATCH</text>
  <rect x="264" y="141" width="216" height="31" rx="7" fill="#283552"/>
  <text x="276" y="162" fill="#eef1ff" font-family="SFMono-Regular, Consolas, monospace" font-size="16">ONNX embeddings</text>
  <rect x="264" y="179" width="216" height="31" rx="7" fill="#283552"/>
  <text x="276" y="200" fill="#eef1ff" font-family="SFMono-Regular, Consolas, monospace" font-size="16">BM25 lexical match</text>

  <path d="M 503 158 H 535" stroke="#6acbd9" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="545" y="91" width="195" height="135" rx="14" fill="#192641" stroke="#4b668b" stroke-width="2"/>
  <text x="563" y="123" fill="#6de1e5" font-family="SFMono-Regular, Consolas, monospace" font-size="16">03 / DECIDE</text>
  <text x="563" y="158" fill="#f2f5ff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Fuse scores</text>
  <text x="563" y="188" fill="#b0bfda" font-family="SFMono-Regular, Consolas, monospace" font-size="14">confidence + margin</text>

  <path d="M 744 158 H 776" stroke="#6acbd9" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="786" y="91" width="184" height="135" rx="14" fill="#1b3441" stroke="#4caaaf" stroke-width="2"/>
  <text x="804" y="123" fill="#6de1e5" font-family="SFMono-Regular, Consolas, monospace" font-size="16">04 / OUTPUT</text>
  <text x="804" y="160" fill="#f2f5ff" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Class label</text>
  <text x="804" y="191" fill="#ace9dc" font-family="SFMono-Regular, Consolas, monospace" font-size="17">or Unknown</text>

  <text x="32" y="258" fill="#91a4c2" font-family="SFMono-Regular, Consolas, monospace" font-size="14">Runs locally · no hosted inference API</text>
</svg>
